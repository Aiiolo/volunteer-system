<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>数据统计</title><style>*{box-sizing:border-box;font-family:"Microsoft Yahei"}body{margin:0;background:#f8f8f8;padding-top:120px}.top{position:fixed;top:0;left:0;width:100%;background:white;padding:18px 35px;display:flex;justify-content:space-between;border-bottom:1px solid #eee;z-index:9}.nav{position:fixed;top:76px;left:0;width:100%;background:#d92121;text-align:center;z-index:9}.nav a{display:inline-block;color:white;text-decoration:none;padding:14px 22px}.box{max-width:1100px;margin:40px auto;background:white;padding:35px;border-radius:8px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff5f5;border:1px solid #ffd7d7;border-radius:8px;padding:28px;text-align:center}.num{font-size:34px;color:#d92121;font-weight:bold;margin-bottom:8px}.btn{background:#d92121;color:white;border:0;border-radius:5px;padding:9px 16px;cursor:pointer}h2{border-left:4px solid #d92121;padding-left:12px}.error{padding:15px;color:#d92121}</style></head><body><div class="top"><h1>三江学院志愿者服务系统</h1><div><span class="role">管理员</span> <button class="btn" onclick="logout()">退出登录</button></div></div><div class="nav"><a href="admin.html">首页</a><a href="admin-volunteer.html">志愿者管理</a><a href="admin-activity.html">活动管理</a><a href="admin-message.html">消息通知</a><a href="admin-statistics.html">数据统计</a><a href="admin-profile.html">个人中心</a></div><div class="box"><h2>平台数据统计</h2><button class="btn" onclick="loadStats()">刷新数据</button> <button class="btn" onclick="exportStats()">导出CSV</button><div class="cards" id="cards" style="margin-top:20px"><div>加载中...</div></div></div><script src="js/common.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{if(requireLogin('ADMIN'))loadStats();});async function loadStats(){cards.innerHTML='<div>加载中...</div>';try{const s=await api('/api/v1/admin/dashboard/stats');cards.innerHTML=`<div class="card"><div class="num">${s.volunteerCount}</div><div>志愿者总数</div></div><div class="card"><div class="num">${s.activityCount}</div><div>活动总数</div></div><div class="card"><div class="num">${s.totalServiceHours}</div><div>累计服务时长</div></div><div class="card"><div class="num">${s.applicationCount}</div><div>报名总数</div></div><div class="card"><div class="num">${s.approvedCount}</div><div>审核通过</div></div><div class="card"><div class="num">${s.approvalRate}%</div><div>报名通过率</div></div>`;}catch(e){cards.innerHTML=`<div class="error">${e.message}</div>`;}}async function exportStats(){if(!token()){alert('请先登录');return;}try{const response=await fetch(`${API_BASE}/api/v1/admin/dashboard/stats/export`,{headers:{Authorization:`Bearer ${token()}`}});if(response.status===401||response.status===403)throw new Error('当前账号无导出权限，请使用管理员账号重新登录');if(!response.ok)throw new Error('导出失败');const blob=await response.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='dashboard-stats.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);}catch(e){alert(e.message);}}</script></body></html>
