<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活动报名 - 三江学院志愿者服务系统</title>
<link rel="stylesheet" href="css/theme.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
html,body{min-height:100vh}
body{background:#f8f8f8;padding-top:160px;display:flex;flex-direction:column;overflow-x:hidden}
a{text-decoration:none;color:inherit}
.main-content{width:min(1200px,calc(100% - 60px));margin:50px auto;padding:40px;background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.05);flex:1 0 auto}
h2{font-size:26px;color:#333;margin-bottom:30px;padding-left:15px;border-left:4px solid #d92121}
.activity-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px;align-items:stretch}
.activity-card{display:flex;flex-direction:column;border:1px solid #eee;border-radius:8px;overflow:hidden;height:520px;min-height:520px;background:#fff}
.activity-card img{width:100%;height:180px;object-fit:cover;background:#eee;flex-shrink:0}
.activity-info{flex:1;display:flex;flex-direction:column;padding:20px;min-height:0}
.activity-body{flex:1;min-height:0}
.activity-footer{flex-shrink:0;margin-top:auto;padding-top:12px}
.activity-title{font-size:18px;color:#333;margin-bottom:10px}
.activity-time,.activity-place,.activity-status{font-size:14px;color:#666;margin-bottom:8px}
.activity-place{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.activity-status{color:#d92121}
.apply-btn{width:100%;border:none;padding:10px;border-radius:4px;cursor:pointer;font-size:16px;background:#d92121;color:#fff}
.apply-btn:disabled{background:#ccc;cursor:not-allowed}
.apply-muted{width:100%;border:none;padding:10px;border-radius:4px;font-size:16px;background:#f0f0f0;color:#999;cursor:not-allowed}
.empty{text-align:center;color:#999;padding:30px;grid-column:1/-1}
.card-link{display:block;color:inherit;flex-shrink:0}
@media (max-width:992px){.activity-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.activity-list{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="main-content">
  <h2>志愿活动</h2>
  <div class="activity-list" id="activityList"></div>
</div>
<script src="js/common.js"></script>
<script>
let activities = [];
let applicationByActivityId = {};

function canVolunteerApply(a) {
    return isActivityRegisterable(a) && !volunteerHasApplied(applicationByActivityId[a.id]);
}

function renderApplyButton(a) {
    const app = applicationByActivityId[a.id];
    if (canVolunteerApply(a)) {
        return `<button class="apply-btn" type="button" onclick="applyActivity(${a.id}, this)">我要报名</button>`;
    }
    return `<p class="apply-muted" style="text-align:center;padding:10px 0;margin:0;font-size:14px;color:#999;">${volunteerRegisterHint(a, app)}</p>`;
}

async function loadActivities() {
    const container = document.getElementById("activityList");
    try {
        const [data, apps] = await Promise.all([
            api("/api/v1/volunteer/activities?page=0&size=100"),
            api("/api/v1/volunteer/applications/status").catch(() => [])
        ]);
        applicationByActivityId = buildApplicationByActivityId(apps);
        let allActivities = (data && data.content) ? data.content : (Array.isArray(data) ? data : []);
        
        // 关键修改：只显示报名中（PUBLISHED）的活动
        activities = allActivities.filter(a => {
            const displayStatus = resolveActivityDisplayStatus(a);
            return displayStatus === "PUBLISHED";
        });
        
        renderActivities();
    } catch (e) {
        container.innerHTML = `<div class="empty">${e.message}</div>`;
    }
}

function renderActivities() {
    const kw = (document.getElementById("keyword")?.value || "").trim();
    const list = activities.filter(a => !kw || (a.title || "").includes(kw) || (a.description || "").includes(kw));
    const container = document.getElementById("activityList");
    if (!list.length) {
        container.innerHTML = '<div class="empty">暂无活动</div>';
        return;
    }
    container.innerHTML = list.map((a, i) => `
        <div class="activity-card">
            <a class="card-link" href="activity/detail.html?id=${a.id}">
                <img src="${a.imageUrl ? mediaUrl(a.imageUrl) : activityImageUrl(a.title, i)}" alt="活动图片" onerror="this.src='${lightweightImage(i + 20, 400, 200)}'">
            </a>
            <div class="activity-info">
                <div class="activity-body">
                    <h3 class="activity-title">${a.title}</h3>
                    <p class="activity-time">活动时间：${fmt(a.startTime)} 至 ${fmt(a.endTime)}</p>
                    <p class="activity-place">活动要求：${a.requirements || "详见活动详情"}</p>
                    <p class="activity-status">状态：${activityStatusText(a.status, a)}｜名额：${a.maxVolunteers}</p>
                </div>
                <div class="activity-footer">
                    ${renderApplyButton(a)}
                </div>
            </div>
        </div>
    `).join("");
}

async function applyActivity(id, btn) {
    if (!confirm("确定报名该活动？")) return;
    try {
        btn.disabled = true;
        btn.textContent = "提交中...";
        await api("/api/v1/volunteer/applications", {
            method: "POST",
            body: JSON.stringify({ activityId: id })
        });
        applicationByActivityId[id] = { activityId: id, status: "PENDING" };
        btn.textContent = "已提交";
        renderActivities();
        alert("报名成功，请等待审核");
    } catch (e) {
        btn.disabled = false;
        btn.textContent = "我要报名";
        alert(e.message);
    }
}

document.addEventListener("DOMContentLoaded", async () => {
    if (!requireLogin("VOLUNTEER")) return;
    await loadActivities();
    const input = document.getElementById("keyword");
    if (input) input.addEventListener("keydown", e => { if (e.key === "Enter") renderActivities(); });
    const btn = document.querySelector(".search-btn");
    if (btn) btn.addEventListener("click", renderActivities);
});
</script>
</body>
</html>
