<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帖子详情 - 社区论坛</title>
<link rel="stylesheet" href="css/theme.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}body{background:#f8f8f8;padding-top:160px}
.detail-wrap{max-width:1100px;margin:50px auto;padding:40px;background:#fff;border-radius:28px;box-shadow:0 24px 70px rgba(140,18,30,.14)}
.back{display:inline-flex;margin-bottom:18px;color:#d92121;font-weight:800;cursor:pointer}
.detail-title-row{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.post-title{font-size:30px;color:#222;flex:1}
.post-badges{display:flex;gap:6px;flex-wrap:wrap}
.forum-badge{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.forum-badge.notice{background:#fff1f2;color:#b91616}
.forum-badge.top{background:#fff3e0;color:#e65100}
.forum-badge.hidden{background:#f0f0f0;color:#666}
.meta{display:flex;gap:16px;flex-wrap:wrap;color:#999;font-size:14px;margin-bottom:26px}
.activity-link{color:#d92121;font-weight:800;cursor:pointer}
.content{font-size:16px;line-height:2;color:#444;background:#fffafa;border:1px solid #f3dadd;border-radius:18px;padding:24px;margin-bottom:22px;white-space:pre-wrap}
.img-gallery{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.img-gallery img{width:160px;height:120px;object-fit:cover;border-radius:12px;border:1px solid #f0dadd;cursor:pointer}
.detail-manage{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.pill-btn{padding:8px 14px;border-radius:999px;border:1px solid #d92121;background:#fff;color:#d92121;font-size:13px;font-weight:700;cursor:pointer}
.pill-btn.danger{border-color:#f53f3f;color:#f53f3f}
.action-row{display:flex;gap:12px;align-items:center;margin-bottom:30px}
.like-btn{background:#d92121;color:#fff;border:0;border-radius:999px;padding:11px 22px;font-weight:900;cursor:pointer}
.like-btn.liked{background:#8f1119}
.count{color:#b91616;font-weight:800}
.comment-box{border-top:1px solid #f1d7d9;padding-top:24px}
.comment-box h3{margin-bottom:16px}
.comment-input{display:grid;gap:12px;margin-bottom:24px}
.comment-input textarea{width:100%;min-height:96px;border:1px solid #f0dadd;border-radius:16px;padding:14px;resize:vertical;background:#fffafa}
.comment-input button{justify-self:end;background:#d92121;color:#fff;border:0;border-radius:999px;padding:10px 22px;font-weight:800;cursor:pointer}
.comment-item{padding:16px;border:1px solid #f0dadd;border-radius:16px;background:#fff;margin-bottom:12px}
.comment-head{display:flex;justify-content:space-between;color:#999;font-size:13px;margin-bottom:8px}
.comment-user{color:#d92121;font-weight:800}
.empty{color:#999;text-align:center;padding:20px}
.not-found{text-align:center;color:#999;padding:50px}
.img-grid{display:flex;flex-wrap:wrap;gap:10px}
.img-item{position:relative;width:100px;height:100px;border-radius:8px;overflow:hidden;border:1px solid #f2d8dc}
.img-item img{width:100%;height:100%;object-fit:cover}
.img-item button{position:absolute;top:4px;right:4px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:12px}
.upload-btn{display:inline-flex;align-items:center;justify-content:center;width:100px;height:100px;border:2px dashed #f3b8bf;border-radius:8px;color:#d92121;font-weight:700;cursor:pointer;background:#fff8f8}
.form-hint{font-size:12px;color:#999;margin-top:6px;line-height:1.5}
#forumComposeModal .activity-modal-panel{width:min(640px,100%)}
</style>
</head>
<body>
<main class="detail-wrap" id="forumDetail"><div class="not-found">加载中...</div></main>

<div class="activity-modal-overlay" id="forumComposeModal">
    <div class="activity-modal-panel">
        <h2 id="forumModalTitle">发布帖子</h2>
        <form id="forumComposeForm" class="std-form-1col" onsubmit="return false;">
            <div class="form-row">
                <label class="form-label" for="forumPostTitle">标题<span style="color:#d92121">*</span></label>
                <div class="form-field">
                    <input id="forumPostTitle" type="text" maxlength="200" placeholder="请输入标题" required>
                </div>
            </div>
            <div class="form-row" id="forumActivityRow">
                <label class="form-label" for="forumActivityId">关联活动</label>
                <div class="form-field">
                    <select id="forumActivityId"><option value="">不关联活动</option></select>
                    <p class="form-hint" id="forumActivityHint"></p>
                </div>
            </div>
            <div class="form-row align-top">
                <label class="form-label" for="forumPostContent">内容<span style="color:#d92121">*</span></label>
                <div class="form-field">
                    <textarea id="forumPostContent" placeholder="请输入正文..." required></textarea>
                </div>
            </div>
            <div class="form-row align-top">
                <label class="form-label">图片上传</label>
                <div class="form-field">
                    <div class="img-grid" id="forumImgGrid">
                        <label class="upload-btn" id="forumUploadLabel">+ 添加</label>
                    </div>
                    <input type="file" id="forumFileInput" accept="image/jpeg,image/png,image/gif,image/webp" multiple hidden>
                    <p class="form-hint">支持 jpg、png、gif、webp，最多 8 张，单张不超过 5MB</p>
                </div>
            </div>
            <div class="activity-modal-actions">
                <button type="button" class="btn-modal-cancel" onclick="forumCloseModal()">取消</button>
                <button type="submit" class="btn-publish" id="forumSubmitBtn">发布</button>
            </div>
        </form>
    </div>
</div>
<script src="js/common.js"></script>
<script src="js/forum-common.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    if (!requireLogin("ADMIN")) return;
    forumInitDetailPage();
});
</script>
</body>
</html>
